# ================================================================
# LearnHub — Docker Compose (Development)
# Services: PostgreSQL (master), Redis, NestJS backend, Angular frontend, Nginx
# ================================================================

services:
  # ----------------------------------------------------------------
  # PostgreSQL — Master Database
  # Stores tenant registry, plans, subscriptions, platform admins
  # ----------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: learnhub-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learnhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnhub_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-learnhub_master}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnhub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------
  # Redis — Sessions, caching, rate limiting
  # ----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: learnhub-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-learnhub_redis_dev}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-learnhub_redis_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------
  # NestJS Backend
  # ----------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: learnhub-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      MASTER_DATABASE_URL: postgresql://${POSTGRES_USER:-learnhub}:${POSTGRES_PASSWORD:-learnhub_dev_password}@postgres:5432/${POSTGRES_DB:-learnhub_master}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-learnhub_redis_dev}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TENANT_DB_HOST: postgres
      TENANT_DB_PORT: 5432
      TENANT_DB_USER: ${POSTGRES_USER:-learnhub}
      TENANT_DB_PASSWORD: ${POSTGRES_PASSWORD:-learnhub_dev_password}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------
  # Angular Frontend
  # ----------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: learnhub-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"

  # ----------------------------------------------------------------
  # Nginx Reverse Proxy
  # ----------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: learnhub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./docker/nginx/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
